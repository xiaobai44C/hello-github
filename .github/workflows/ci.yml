name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    name: 跑一遍示例脚本
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法检查
        run: python -m py_compile hello.py

      - name: 运行 hello.py
        run: python hello.py

      - name: 汇报
        run: |
          echo "✅ 全部通过"
          echo "提交者: ${{ github.actor }}"
          echo "分支: ${{ github.ref_name }}"
          echo "提交信息: ${{ github.event.head_commit.message }}"
